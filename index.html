<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1114">
<script>try{var r=document.documentElement,h=localStorage.getItem("bs_hell")||"dunkel";if(h==="hell"||(h==="auto"&&matchMedia("(prefers-color-scheme: light)").matches))r.dataset.hell="1";}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baustellen">
<meta name="robots" content="noindex,nofollow">
<title>Baustellen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  /* Grund dunkel: Basalt */
  --bg:#0f1114;--fl:#171a1f;--fl2:#1f232a;--fl3:#282d35;--rand:#2f343d;
  --text:#eef0f2;--leise:#9ba2ad;
  --gut:#7ec49a;--gut-w:rgba(126,196,154,.14);--warn:#e5b24f;--warn-w:rgba(229,178,79,.14);--schlecht:#f07a6c;--schlecht-w:rgba(240,122,108,.15);
  --schatten:none;--r:14px;--nav:66px;color-scheme:dark;
  /* Akzent: Signalblau */
  --akz:#5aa9ff;--akz-t:#06111f;--akz-w:rgba(90,169,255,.18);--papier-akz:#1d4f8f;
}
:root[data-hell]{
  /* Grund hell: Kalkstein */
  --bg:#f2f3f5;--fl:#ffffff;--fl2:#eaedf0;--fl3:#dfe3e8;--rand:#d5dae0;
  --text:#15181c;--leise:#5d6570;
  --gut:#177a45;--gut-w:#dcf1e4;--warn:#955f05;--warn-w:#fbefd6;--schlecht:#b42318;--schlecht-w:#fde4e1;
  --schatten:0 1px 2px rgba(15,20,30,.06),0 2px 10px rgba(15,20,30,.05);color-scheme:light;
  --akz:#1d64c4;--akz-t:#ffffff;--akz-w:rgba(29,100,196,.11);
}
:root{--akz2:var(--akz);--akz2-t:var(--akz-t);--akz2-w:var(--akz-w)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--akz2)}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.15rem}
h3{font-size:1rem}
.leise{color:var(--leise)}
.klein{font-size:.85rem}
.rechts{text-align:right}
.zahl{font-variant-numeric:tabular-nums;white-space:nowrap}
.fett{font-weight:600}
.versteckt{display:none!important}

/* Rahmen */
.kopf{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg);border-bottom:1px solid var(--rand)}
.kopf h1{font-family:"Archivo Black","Archivo",system-ui,sans-serif;font-weight:400;letter-spacing:.01em;font-size:1.12rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopf .zurueck{border:0;background:none;padding:6px 8px 6px 0;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--text)}
.syncpunkt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rand);background:var(--fl);border-radius:20px;padding:4px 10px;font-size:.8rem;color:var(--leise);cursor:pointer;white-space:nowrap}
.syncpunkt i{width:8px;height:8px;border-radius:50%;background:var(--gut);display:inline-block}
.syncpunkt.offen i{background:var(--warn)}
.syncpunkt.fehler i,.syncpunkt.offline i{background:var(--schlecht)}
.syncpunkt.laeuft i{background:var(--akz2);animation:puls 1s infinite}
.syncpunkt.lokal i{background:var(--leise)}
@keyframes puls{50%{opacity:.3}}
.uhrchip{display:flex;align-items:center;gap:8px;margin:10px 14px 0;padding:10px 14px;border-radius:var(--r);background:var(--akz);color:var(--akz-t);cursor:pointer;font-weight:600}
.uhrchip .uhrzeit{font-variant-numeric:tabular-nums;font-size:1.05rem}
.uhrchip .uhrprojekt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;opacity:.9}
.uhrchip.pause{background:var(--warn-w);color:var(--warn)}
main{padding:14px 14px calc(var(--nav) + 28px + env(safe-area-inset-bottom));max-width:980px;margin:0 auto}
nav.unten{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;align-items:stretch;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--rand)}
nav.unten a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--leise);font-size:.72rem}
nav.unten a svg{width:24px;height:24px}
nav.unten a.aktiv{color:var(--akz2);font-weight:700}
nav.unten a.aktiv svg{background:var(--akz2-w);border-radius:12px;padding:3px 12px;width:50px;height:30px;box-sizing:border-box}
nav.unten a.plus span.rund{display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;background:var(--akz);color:var(--akz-t);margin-top:-18px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
nav.unten a.plus svg{width:28px;height:28px}
@media (min-width:960px){
  body{padding-left:220px}
  nav.unten{top:0;right:auto;width:220px;height:auto;flex-direction:column;justify-content:flex-start;padding:20px 10px;border-top:0;border-right:1px solid var(--rand);gap:4px}
  nav.unten a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:10px;font-size:.95rem}
  nav.unten a.aktiv{background:var(--akz2-w)}
  nav.unten a.plus{order:-1;margin-bottom:12px}
  nav.unten a.plus span.rund{width:36px;height:36px;margin:0;box-shadow:none}
  nav.unten a.plus svg{width:22px;height:22px}
  main{padding-bottom:40px}
}

/* Bausteine */
.karte{background:var(--fl);border:1px solid var(--rand);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--schatten)}
.karte>h2,.karte>h3,.abschnitt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.abschnitt{margin:18px 2px 8px}
.abschnitt h2{font-size:.75rem;color:var(--leise);text-transform:uppercase;letter-spacing:.11em;font-weight:700}
.raster{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kennzahl{background:var(--fl);border:1px solid var(--rand);border-radius:var(--r);padding:12px 14px}
.kennzahl b{display:block;font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.kennzahl span{font-size:.68rem;color:var(--leise);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.kennzahl b.text{font-size:1rem;font-weight:600;padding-top:4px}
.kennzahl.gut b{color:var(--gut)}.kennzahl.schlecht b{color:var(--schlecht)}.kennzahl.warn b{color:var(--warn)}
.liste{background:var(--fl);border:1px solid var(--rand);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--schatten)}
.zeile{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--rand);cursor:pointer;min-height:56px}
.zeile:first-child{border-top:0}
.zeile:active{background:var(--fl2)}
.zeile .mitte{flex:1;min-width:0}
.zeile .titel{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile .unter{font-size:.85rem;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile .wert{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.zeile .wert small{display:block;color:var(--leise);font-size:.78rem}
.zeile.erledigt .titel{text-decoration:line-through;color:var(--leise)}
.gruppenkopf{padding:8px 14px;background:var(--fl2);font-size:.8rem;font-weight:700;color:var(--akz2);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;border-top:1px solid var(--rand)}
.gruppenkopf:first-child{border-top:0}
.leer{text-align:center;color:var(--leise);padding:28px 16px}
.leer b{display:block;color:var(--text);margin-bottom:4px}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--fl2);color:var(--leise);white-space:nowrap}
.badge.anfrage{background:var(--fl3);color:var(--text)}
.badge.angebot{background:var(--warn-w);color:var(--warn)}
.badge.beauftragt,.badge.arbeit{background:var(--akz2);color:var(--akz2-t)}
.badge.fertig{background:var(--gut-w);color:var(--gut)}
.badge.abgerechnet{background:var(--warn-w);color:var(--warn)}
.badge.bezahlt{background:var(--gut-w);color:var(--gut)}
.badge.offen{background:var(--schlecht-w);color:var(--schlecht)}
.badge.behoben,.badge.angenommen{background:var(--gut-w);color:var(--gut)}
.badge.abgelehnt{background:var(--schlecht-w);color:var(--schlecht)}
.badge.entwurf{background:var(--fl3);color:var(--leise)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rand);background:var(--fl);border-radius:20px;padding:7px 14px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.chip.aktiv{background:var(--akz2);color:var(--akz2-t);border-color:var(--akz2);font-weight:600}
.reiter{display:flex;gap:4px;overflow-x:auto;margin:0 -14px 14px;padding:0 14px;border-bottom:1px solid var(--rand);scrollbar-width:none;position:sticky;top:57px;background:var(--bg);z-index:10}
.reiter::-webkit-scrollbar{display:none}
.reiter a{flex:none;padding:10px 12px;text-decoration:none;color:var(--leise);border-bottom:2px solid transparent;font-size:.92rem}
.reiter a.aktiv{color:var(--akz2);border-color:var(--akz2);border-bottom-width:3px;font-weight:700;background:var(--akz2-w);border-radius:8px 8px 0 0}
.suche{width:100%;padding:11px 14px;border:1px solid var(--rand);border-radius:12px;background:var(--fl);margin-bottom:10px}

/* Knöpfe */
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--rand);background:var(--fl);cursor:pointer;font-weight:600;text-decoration:none;color:var(--text);white-space:nowrap}
.knopf.haupt{background:var(--akz);border-color:var(--akz);color:var(--akz-t)}
.knopf.gefahr{color:var(--schlecht)}
.knopf.klein{min-height:34px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.knopf.breit{width:100%}
.knopf:disabled{opacity:.5;cursor:default}
.knopfreihe{display:flex;gap:8px;flex-wrap:wrap}
.knopfreihe.ende{justify-content:flex-end}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));z-index:25;width:56px;height:56px;border-radius:18px;border:0;background:var(--akz);color:var(--akz-t);font-size:1.8rem;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}
@media (min-width:960px){.fab{bottom:28px;right:28px}}
.kachelwahl{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kachelwahl button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:var(--r);border:1px solid var(--rand);background:var(--fl);cursor:pointer;text-align:left;font-weight:600;min-height:84px}
.kachelwahl button span{font-size:1.4rem}
.kachelwahl button small{font-weight:400;color:var(--leise);font-size:.8rem}

/* Formulare */
.formular{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feld{display:flex;flex-direction:column;gap:5px;grid-column:span 2}
.feld.halb{grid-column:span 1}
.feld label,.feldtitel{font-size:.8rem;font-weight:600;color:var(--leise)}
.feld input,.feld select,.feld textarea{width:100%;padding:11px 12px;border:1px solid var(--rand);border-radius:10px;background:var(--fl);min-height:46px}
.feld textarea{min-height:90px;resize:vertical}
.feld input:focus,.feld select:focus,.feld textarea:focus{outline:2px solid var(--akz2);outline-offset:-1px;border-color:transparent}
.feld .hilfe{font-size:.78rem;color:var(--leise)}
.feld.check{flex-direction:row;align-items:center;gap:10px}
.feld.check input{width:22px;height:22px;min-height:0;accent-color:var(--akz)}
.feld.check label{font-size:.95rem;color:var(--text);font-weight:500}
.vorschau{grid-column:span 2;background:var(--fl2);border-radius:10px;padding:10px 12px;font-size:.9rem;display:flex;flex-wrap:wrap;gap:4px 16px}
.vorschau b{font-variant-numeric:tabular-nums}
.fehlertext{color:var(--schlecht);font-size:.9rem;margin-top:8px}

/* Ebene (Blatt von unten) */
.ebene{position:fixed;inset:0;z-index:50;background:rgba(6,5,4,.62);display:flex;align-items:flex-end;justify-content:center;animation:ein .15s}
.blatt{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:hoch .2s}
@media (min-width:700px){.ebene{align-items:center}.blatt{border-radius:20px;max-height:88vh}}
.blatt>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--rand)}
.blatt>header h2{flex:1}
.blatt>header button{border:0;background:var(--fl2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.blatt>.inhalt{overflow-y:auto;padding:16px;flex:1;-webkit-overflow-scrolling:touch}
.blatt>footer{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rand)}
.blatt>footer .knopf{flex:1}
.blatt>footer .knopf.gefahr{flex:0 0 auto}
@keyframes ein{from{opacity:0}}
@keyframes hoch{from{transform:translateY(40px);opacity:.5}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.zeigen{opacity:1}

/* Logo und Briefpapier */
.kopflogo{height:28px;max-width:110px;object-fit:contain;flex:none}
.papier{position:relative}
.papier .papierlogo{max-height:64px;max-width:240px;display:block;margin-bottom:6px}
.papier .briefpapier{position:absolute;top:0;left:0;width:100%;height:auto;z-index:0;pointer-events:none}
.papier.mit-bp>*:not(.briefpapier){position:relative;z-index:1}
.bp-rahmen{width:100%;border-collapse:collapse}
.bp-rahmen>thead>tr>td,.bp-rahmen>tfoot>tr>td{padding:0}
.papier.mit-bp{aspect-ratio:auto;min-height:calc(100vw * 1.414);}
@media (min-width:794px){.papier.mit-bp{min-height:1123px}}

/* Fotos */
.fotoraster{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.fotoraster .foto{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--fl2);cursor:pointer}
.fotoraster .foto img{width:100%;height:100%;object-fit:cover;display:block}
.fotoraster .foto .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.fotoraster .foto .hoch{position:absolute;left:4px;bottom:4px;font-size:.65rem;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 5px}
.fotostreifen{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.fotostreifen img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.bildansicht{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.bildansicht img{flex:1;min-height:0;object-fit:contain;width:100%}
.bildansicht footer{display:flex;gap:8px;padding:12px;color:#fff;align-items:center}
.bildansicht footer span{flex:1;font-size:.9rem}

/* Tabellen */
.tabelle{width:100%;border-collapse:collapse;font-size:.9rem}
.tabelle th{text-align:left;font-size:.75rem;color:var(--leise);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--rand);text-transform:uppercase;letter-spacing:.03em}
.tabelle td{padding:8px 6px;border-bottom:1px solid var(--rand);vertical-align:top}
.tabelle td.z,.tabelle th.z{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabelle tr.summe td{font-weight:700;border-bottom:0}
.tabelle tr.klickbar{cursor:pointer}
.tabellenrahmen{overflow-x:auto}
.balken{height:8px;background:var(--fl2);border-radius:4px;overflow:hidden;min-width:60px}
.balken i{display:block;height:100%;background:var(--akz2);border-radius:4px}
.ampel-gut{color:var(--gut)}.ampel-warn{color:var(--warn)}.ampel-schlecht{color:var(--schlecht)}

/* Anmeldung / PIN */
.vollbild{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.anmeldung{width:100%;max-width:400px}
.anmeldung .logo{width:64px;height:64px;margin-bottom:14px}
.anmeldung h1{font-size:1.5rem;margin-bottom:6px}
.anmeldung p{color:var(--leise);margin:0 0 18px}
.pinpunkte{display:flex;gap:14px;justify-content:center;margin:18px 0 24px}
.pinpunkte i{width:16px;height:16px;border-radius:50%;border:2px solid var(--leise)}
.pinpunkte i.voll{background:var(--akz);border-color:var(--akz)}
.pinfeld{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:290px;margin:0 auto}
.pinfeld button{height:64px;border-radius:50%;border:1px solid var(--rand);background:var(--fl);font-size:1.5rem;cursor:pointer}
.pinfeld button.leer{border:0;background:none;font-size:.9rem;color:var(--leise)}

/* Aufmaß */
.amzeile{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--rand);align-items:end}
.amzeile .amtext{grid-column:1/5}
.amzeile .amx{grid-column:5;min-height:38px}
.amzeile .amf{display:flex;flex-direction:column;gap:2px;font-size:.72rem;color:var(--leise)}
.amzeile .amab{grid-column:1/3;display:flex;align-items:center;gap:6px;font-size:.85rem}
.amzeile .er{grid-column:3/6;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.amfuss{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.aufmass{grid-column:span 2;border:1px solid var(--rand);border-radius:12px;padding:10px;background:var(--fl)}
.aufmass table{width:100%;border-collapse:collapse;font-size:.85rem}
.aufmass td{padding:3px 2px}
.aufmass input{width:100%;padding:7px 6px;border:1px solid var(--rand);border-radius:8px;background:var(--bg);min-height:38px}
.aufmass input[type=checkbox]{width:20px;height:20px;min-height:0}
.aufmass .er{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;padding-left:6px}

/* Dokument / Papier */
.papier{background:#fff;color:#111;width:100%;max-width:794px;margin:0 auto 16px;padding:48px 52px;box-shadow:0 2px 16px rgba(0,0,0,.12);font-size:13px;line-height:1.45;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.papier .briefkopf{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--papier-akz);padding-bottom:12px;margin-bottom:28px}
.papier .briefkopf .firma{font-size:18px;font-weight:700;color:var(--papier-akz)}
.papier .briefkopf .kontakt{text-align:right;font-size:11px;color:#555}
.papier .absenderzeile{font-size:9px;color:#777;text-decoration:underline;margin-bottom:4px}
.papier .anschrift{min-height:100px;margin-bottom:24px}
.papier .kopfdaten{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:20px}
.papier .kopfdaten h1{font-size:22px;color:#111}
.papier .kopfdaten table td{padding:1px 0 1px 14px;font-size:12px}
.papier .kopfdaten table td:first-child{color:#666;padding-left:0}
.papier table.pos{width:100%;border-collapse:collapse;margin:14px 0}
.papier table.pos th{font-size:10.5px;text-transform:uppercase;color:#666;text-align:left;border-bottom:1.5px solid #333;padding:6px 5px}

<body>
<div id="app"><div class="vollbild"><div class="leise">Baustellen wird geladen …</div></div></div>
<div id="ebene"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================================
   Baustellen-App · Kern: Hilfsfunktionen, Datenhaltung, Rechenlogik
   ========================================================================= */

const APP_VERSION = '1.0';

/* ---------- Hilfen ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const neueId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
const jetztISO = () => new Date().toISOString();
const zz = n => String(n).padStart(2, '0');
const datumISO = d => d.getFullYear() + '-' + zz(d.getMonth() + 1) + '-' + zz(d.getDate());
const heute = () => datumISO(new Date());
const zeitHM = d => zz(d.getHours()) + ':' + zz(d.getMinutes());
const rund = n => Math.round((+n || 0) * 100) / 100;
const fmtEUR = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const eur = n => fmtEUR.format(rund(n));
const zahl = (n, d = 2) => (+n || 0).toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: d });
const zahlFest = (n, d = 2) => (+n || 0).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const stdText = n => zahl(n, 2) + ' Std.';
const datumDE = iso => iso && iso.length >= 10 ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4) : '';
const datumKurz = iso => iso && iso.length >= 10 ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' : '';
const WOCHENTAGE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const wochentag = iso => WOCHENTAGE[new Date(iso + 'T12:00:00').getDay()];
const tageDazu = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return datumISO(d); };
const wochenbeginn = iso => { const d = new Date(iso + 'T12:00:00'); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return datumISO(d); };

function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v ?? '').trim().replace(/\s|€|%/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const zahlFeld = n => (n === '' || n == null) ? '' : String(+(+n).toFixed(4)).replace('.', ',');

function minuten(hm) { if (!hm || !/^\d{1,2}:\d{2}/.test(hm)) return null; const [h, m] = hm.split(':').map(Number); return h * 60 + m; }

const ls = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { v === null || v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, String(v)); } catch { /* egal */ } },
  getJ(k, d = null) { try { return JSON.parse(this.get(k)) ?? d; } catch { return d; } },
  setJ(k, v) { this.set(k, v === null ? null : JSON.stringify(v)); }
};

async function sha256(text) {
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 0; for (const c of text) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h;
}

/* ---------- Datenmodell ---------- */
const TABELLEN = ['projekte', 'kunden', 'positionen', 'zeiten', 'doku', 'fotos', 'aufgaben',
  'artikel', 'lohnarten', 'dokumente', 'zahlungen', 'einstellungen'];
const FELD_ZAHL = new Set(['menge', 'ek', 'aufschlag', 'verschnitt', 'vk', 'pause', 'stunden', 'satz',
  'kmSatz', 'kmKosten', 'km', 'netto', 'steuer', 'brutto', 'abzug', 'zahlbar', 'betrag', 'sort', 'steuersatz']);
const FELD_JANEIN = new Set(['geloescht', 'abrechenbar', 'erledigt', 'nachweis']);
const FELD_JSON = new Set(['aufmass', 'daten']);

function normalisieren(z) {
  const r = {};
  for (const k of Object.keys(z)) {
    if (k === '_sync') continue;
    let v = z[k];
    if (FELD_ZAHL.has(k)) v = num(v);
    else if (FELD_JANEIN.has(k)) v = v === true || v === 'ja' || v === 'TRUE' || v === 'true' || v === 1;
    else if (FELD_JSON.has(k)) { if (typeof v === 'string') { try { v = v ? JSON.parse(v) : null; } catch { v = null; } } }
    else v = v == null ? '' : String(v);
    r[k] = v;
  }
  return r;
}

const STATUS = [
  ['anfrage', 'Anfrage'], ['angebot', 'Angebot'], ['beauftragt', 'Beauftragt'], ['arbeit', 'In Arbeit'],
  ['fertig', 'Fertig'], ['abgerechnet', 'Abgerechnet'], ['bezahlt', 'Bezahlt']
];
const statusText = s => (STATUS.find(x => x[0] === s) || [s, s || '–'])[1];
const AKTIV = new Set(['beauftragt', 'arbeit']);
const TYPEN = { material: 'Material', lohn: 'Lohn', fremd: 'Fremdleistung', fahrt: 'Fahrt', pauschal: 'Pauschale' };
const DOKU_ARTEN = { bericht: 'Tagesbericht', mangel: 'Mangel', absprache: 'Absprache', notiz: 'Notiz' };
const ZAHLUNG_ARTEN = { anzahlung: 'Anzahlung', abschlag: 'Abschlag', zahlung: 'Zahlung' };

/* ---------- IndexedDB (mit Rückfall auf Arbeitsspeicher) ---------- */
const idb = {
  db: null, mem: null,
  async open() {
    try {
      await new Promise((res, rej) => {
        const r = indexedDB.open('baustellen', 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          db.createObjectStore('zeilen', { keyPath: 'k' });
          db.createObjectStore('fotos');
          db.createObjectStore('meta');
        };
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blockiert'));
      });
    } catch (e) {
      console.warn('IndexedDB nicht verfügbar, Daten nur im Arbeitsspeicher', e);
      this.mem = { zeilen: new Map(), fotos: new Map(), meta: new Map() };
    }
  },
  req(store, mode, fn) {
    if (this.mem) return Promise.resolve(fn(null));
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode);
      const r = fn(tx.objectStore(store));
      tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  get(store, key) { if (this.mem) return Promise.resolve(this.mem[store].get(key)); return this.req(store, 'readonly', s => s.get(key)); },
  put(store, val, key) {
    if (this.mem) { this.mem[store].set(key ?? val.k, val); return Promise.resolve(); }
    return this.req(store, 'readwrite', s => { key === undefined ? s.put(val) : s.put(val, key); });
  },
  putViele(store, vals) {
    if (this.mem) { vals.forEach(v => this.mem[store].set(v.k, v)); return Promise.resolve(); }
    return this.req(store, 'readwrite', s => { vals.forEach(v => s.put(v)); });
  },
  del(store, key) { if (this.mem) { this.mem[store].delete(key); return Promise.resolve(); } return this.req(store, 'readwrite', s => { s.delete(key); }); },
  alle(store) { if (this.mem) return Promise.resolve([...this.mem[store].values()]); return this.req(store, 'readonly', s => s.getAll()); },
  leeren(store) { if (this.mem) { this.mem[store].clear(); return Promise.resolve(); } return this.req(store, 'readwrite', s => { s.clear(); }); }
};

/* ---------- Speicher im Arbeitsspeicher ---------- */
const D = {};
TABELLEN.forEach(t => { D[t] = new Map(); });
const META = { offen: {}, seit: '', fotoOffen: [] };

async function datenLaden() {
  await idb.open();
  const zeilen = await idb.alle('zeilen');
  zeilen.forEach(e => { if (D[e.t]) D[e.t].set(e.z.id, e.z); });
  META.offen = (await idb.get('meta', 'offen')) || {};
  META.seit = (await idb.get('meta', 'seit')) || '';
  META.fotoOffen = (await idb.get('meta', 'fotoOffen')) || [];
}
async function metaSichern() {
  await idb.put('meta', META.offen, 'offen');
  await idb.put('meta', META.seit, 'seit');
  await idb.put('meta', META.fotoOffen, 'fotoOffen');
}

const alle = t => [...D[t].values()].filter(z => !z.geloescht);
const hol = (t, id) => { const z = id && D[t].get(id); return z && !z.geloescht ? z : null; };
const vonProjekt = (t, pid) => alle(t).filter(z => z.projektId === pid);

async function speichere(t, z, still) {
  if (!z.id) z.id = neueId();
  if (!z.erstellt) z.erstellt = jetztISO();
  z.geaendert = jetztISO();
  if (z.geloescht === undefined) z.geloescht = false;
  D[t].set(z.id, z);
  await idb.put('zeilen', { k: t + '|' + z.id, t, z });
  META.offen[t + '|' + z.id] = true;
  await idb.put('meta', META.offen, 'offen');
  if (!still && typeof syncBald === 'function') syncBald();
  return z;
}
async function loesche(t, id) { const z = D[t].get(id); if (!z) return; z.geloescht = true; await speichere(t, z); }
async function wiederherstellen(t, id) { const z = D[t].get(id); if (!z) return; z.geloescht = false; await speichere(t, z); }

/* ---------- Einstellungen ---------- */
const STANDARD = {
  firma: '', inhaber: '', strasse: '', ort: '', telefon: '', email: '', web: '',
  bank: '', iban: '', bic: '', steuernr: '',
  aufschlag: '30', verschnitt: '10', kmSatz: '0,50', kmKosten: '0,30', standardLohnart: 'lohn-standard',
  steuermodus: 'intern', steuersatz: '19', zahlungsziel: '14',
  gewerke: 'Holzbau / Tragwerk\nAusbau / Montage\nOberfläche / Entsorgung',
  einheiten: 'Stk\nlfm\nm²\nm³\nkg\nStd.\nkm\npsch.\nSatz',
  nrProjekt: 'P-{JJJJ}-{NNN}', nrAngebot: 'A-{JJJJ}-{NNN}', nrAbrechnung: 'R-{JJJJ}-{NNN}',
  angebotEinleitung: 'vielen Dank für Ihre Anfrage. Gerne biete ich Ihnen die folgenden Leistungen an:',
  angebotSchluss: 'Das Angebot ist 30 Tage gültig. Ich freue mich auf Ihren Auftrag.',
  abrechnungEinleitung: 'für die ausgeführten Arbeiten erlaube ich mir, wie folgt abzurechnen:',
  abrechnungSchluss: 'Bitte überweisen Sie den Betrag innerhalb von {ZIEL} Tagen auf das unten genannte Konto. Vielen Dank für Ihren Auftrag.'
};
function E(k) { const z = hol('einstellungen', k); return z ? z.wert : (STANDARD[k] ?? ''); }
const En = k => num(E(k));
async function setzeE(k, wert) {
  const alt = D.einstellungen.get(k);
  if (alt && !alt.geloescht && alt.wert === String(wert)) return;
  await speichere('einstellungen', Object.assign(alt || { id: k }, { wert: String(wert), geloescht: false }));
}
const zeilenListe = k => E(k).split('\n').map(s => s.trim()).filter(Boolean);
const gewerke = () => zeilenListe('gewerke');
const einheiten = () => zeilenListe('einheiten');

async function grunddatenAnlegen() {
  if (!D.lohnarten.has('lohn-standard')) {
    await speichere('lohnarten', { id: 'lohn-standard', name: 'Tischlermeister', satz: 40 }, true);
  }
}
const lohnarten = () => alle('lohnarten').sort((a, b) => a.name.localeCompare(b.name, 'de'));
const lohnart = id => hol('lohnarten', id) || hol('lohnarten', E('standardLohnart')) || lohnarten()[0] || { id: '', name: 'Arbeitszeit', satz: 0 };

/* ---------- Nummernkreise ---------- */
function naechsteNr(musterKey, tabelle, filter) {
  const jahr = String(new Date().getFullYear());
  const muster = E(musterKey) || STANDARD[musterKey];
  const vor = muster.split('{NNN}')[0].replace('{JJJJ}', jahr);
  const nach = (muster.split('{NNN}')[1] || '').replace('{JJJJ}', jahr);
  let max = 0;
  [...D[tabelle].values()].filter(z => !filter || filter(z)).forEach(z => {
    const nr = z.nr || '';
    if (nr.startsWith(vor) && nr.endsWith(nach)) {
      const n = parseInt(nr.slice(vor.length, nr.length - nach.length), 10);
      if (n > max) max = n;
    }
  });
  return vor + String(max + 1).padStart(3, '0') + nach;
}

/* ---------- Rechenlogik ---------- */
function posWerte(p) {
  const m = +p.menge || 0, ek = +p.ek || 0;
  const a = (+p.aufschlag || 0) / 100, v = (+p.verschnitt || 0) / 100;
  let ekS = 0, vkS = 0;
  switch (p.typ) {
    case 'material': ekS = m * (1 + v) * ek; vkS = ekS * (1 + a); break;
    case 'fremd': ekS = m * ek; vkS = ekS * (1 + a); break;
    case 'lohn': ekS = 0; vkS = m * (+p.vk || 0); break;
    case 'fahrt': ekS = m * ek; vkS = m * (+p.vk || 0); break;
    default: ekS = m * ek; vkS = m * (+p.vk || 0);
  }
  const ep = m ? rund(vkS / m) : rund(vkS);
  return { ek: rund(ekS), vk: m ? rund(m * ep) : rund(vkS), ep, std: p.typ === 'lohn' ? m : 0 };
}

function aufmassMenge(zeilen) {
  let s = 0;
  (zeilen || []).forEach(r => {
    const f = ['n', 'l', 'b', 'h'].map(k => r[k] === '' || r[k] == null ? null : num(r[k])).filter(x => x !== null);
    if (!f.length) return;
    const w = f.reduce((a, b) => a * b, 1);
    s += r.abzug ? -w : w;
  });
  return Math.round(s * 1000) / 1000;
}

function zeitStunden(z) {
  const v = minuten(z.von), b = minuten(z.bis);
  if (v === null || b === null) return +z.stunden || 0;
  let d = b - v; if (d < 0) d += 24 * 60;
  return Math.max(0, Math.round((d - (+z.pause || 0)) / 60 * 100) / 100);
}

function angebotFuer(pid) {
  const a = alle('dokumente').filter(d => d.projektId === pid && d.art === 'angebot' && d.status !== 'entwurf');
  return a.find(d => d.status === 'angenommen') || a.filter(d => d.status !== 'abgelehnt').sort((x, y) => (y.datum || '').localeCompare(x.datum || ''))[0] || null;
}

function projektZahlen(pid) {
  const p = hol('projekte', pid) || {};
  const soll = { ek: 0, vk: 0, std: 0, mat: 0, fremd: 0, fahrt: 0, lohn: 0 };
  const ist = { std: 0, lohnVk: 0, mat: 0, fremd: 0, fahrt: 0, sonst: 0, vk: 0, ek: 0, offenStd: 0 };
  vonProjekt('positionen', pid).forEach(pos => {
    const w = posWerte(pos);
    if (pos.bereich === 'ist') {
      ist.vk += w.vk; ist.ek += w.ek;
      if (pos.typ === 'material') ist.mat += w.ek;
      else if (pos.typ === 'fremd') ist.fremd += w.ek;
      else if (pos.typ === 'fahrt') ist.fahrt += w.ek;
      else ist.sonst += w.ek;
    } else {
      soll.ek += w.ek; soll.vk += w.vk; soll.std += w.std;
      if (pos.typ === 'material') soll.mat += w.ek;
      else if (pos.typ === 'fremd') soll.fremd += w.ek;
      else if (pos.typ === 'fahrt') soll.fahrt += w.ek;
      else if (pos.typ === 'lohn') soll.lohn += w.vk;
    }
  });
  vonProjekt('zeiten', pid).forEach(z => {
    ist.std += +z.stunden || 0;
    if (z.abrechenbar) { const v = rund((+z.stunden || 0) * (+z.satz || 0)); ist.lohnVk += v; ist.vk += v; }
    if (z.abrechenbar && !z.abgerechnetIn) ist.offenStd += +z.stunden || 0;
  });
  const abr = alle('dokumente').filter(d => d.projektId === pid && d.art === 'abrechnung' && d.status !== 'entwurf');
  const abgerechnetNetto = abr.reduce((s, d) => s + (+d.netto || 0), 0);
  const abgerechnetBrutto = abr.reduce((s, d) => s + (+d.brutto || 0), 0);
  const bezahlt = vonProjekt('zahlungen', pid).reduce((s, z) => s + (+z.betrag || 0), 0);
  const ang = angebotFuer(pid);
  const angebotNetto = ang ? +ang.netto || 0 : 0;
  let erloes, erloesArt;
  if (abgerechnetNetto > 0) { erloes = abgerechnetNetto; erloesArt = 'abgerechnet'; }
  else if (p.art === 'festpreis') { erloes = angebotNetto || soll.vk; erloesArt = angebotNetto ? 'laut Angebot' : 'laut Kalkulation'; }
  else { erloes = ist.vk; erloesArt = 'laut Erfassung'; }
  const kosten = ist.ek;
  const gewinn = erloes - kosten;
  return {
    soll, ist, angebotNetto, abgerechnetNetto, abgerechnetBrutto, bezahlt,
    offen: rund(abgerechnetBrutto - bezahlt), erloes, erloesArt, kosten, gewinn,
    stundenlohn: ist.std > 0 ? gewinn / ist.std : null
  };
}

function abweichung(soll, ist) {
  if (!soll) return { text: ist ? 'ohne Soll' : '–', klasse: '' };
  const p = (ist - soll) / soll * 100;
  return { text: (p > 0 ? '+' : '') + zahl(p, 0) + ' %', klasse: p > 10 ? 'ampel-schlecht' : p > 0 ? 'ampel-warn' : 'ampel-gut' };
}

const projektName = pid => { const p = hol('projekte', pid); return p ? p.name : '–'; };
const kundeName = kid => { const k = hol('kunden', kid); return k ? k.name : ''; };

/* =========================================================================
   Abgleich mit dem Backend und Fotos
   ========================================================================= */

const modus = () => ls.get('bs_modus', '');          // 'server' | 'lokal' | ''
const SY = { status: 'ok', laeuft: false, nochmal: false, timer: null, fehler: '', zuletzt: null };

async function api(aktion, daten = {}) {
  const url = ls.get('bs_url');
  if (!url) throw new Error('Keine Backend-Adresse eingetragen.');
  let r;
  try {
    r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ aktion, token: ls.get('bs_token') }, daten))
    });
  } catch (e) {
    throw new Error('Keine Verbindung zum Backend.');
  }
  if (!r.ok) throw new Error('Das Backend antwortet nicht (' + r.status + ').');
  let j;
  try { j = await r.json(); } catch { throw new Error('Unerwartete Antwort – ist die Web-App für „Jeder“ freigegeben?'); }
  if (!j.ok) { const e = new Error(j.fehler || 'Unbekannter Fehler'); e.abgemeldet = !!j.abgemeldet; throw e; }
  return j;
}

function syncBald(ms = 1500) {
  if (modus() !== 'server') return;
  clearTimeout(SY.timer);
  SY.timer = setTimeout(sync, ms);
  syncAnzeigen();
}

const anzahlOffen = () => Object.keys(META.offen).length + META.fotoOffen.length;

async function sync() {
  if (modus() !== 'server' || !ls.get('bs_token')) return;
  if (SY.laeuft) { SY.nochmal = true; return; }
  if (!navigator.onLine) { SY.status = 'offline'; syncAnzeigen(); return; }
  SY.laeuft = true; SY.status = 'laeuft'; syncAnzeigen();
  let geaendert = false;
  try {
    await fotosHochladen();
    let runde = 0;
    do {
      const paket = [];
      let groesse = 0;
      for (const k of Object.keys(META.offen)) {
        const [t, id] = k.split('|');
        const z = D[t] && D[t].get(id);
        if (!z) { delete META.offen[k]; continue; }
        const s = JSON.stringify(z).length;
        if (paket.length && (groesse + s > 1500000 || paket.length >= 300)) break;
        paket.push({ t, z }); groesse += s;
      }
      const j = await api('sync', { seit: META.seit, aenderungen: paket });
      for (const a of paket) {
        const akt = D[a.t].get(a.z.id);
        if (akt && akt.geaendert === a.z.geaendert) delete META.offen[a.t + '|' + a.z.id];
      }
      if (await uebernehmen(j.daten)) geaendert = true;
      META.seit = j.serverZeit;
      await metaSichern();
      runde++;
    } while (Object.keys(META.offen).length && runde < 20);
    SY.status = 'ok'; SY.fehler = ''; SY.zuletzt = new Date();
  } catch (e) {
    if (e.abgemeldet) { SY.laeuft = false; abgemeldet(); return; }
    SY.status = navigator.onLine ? 'fehler' : 'offline';
    SY.fehler = e.message;
  } finally {
    SY.laeuft = false;
    syncAnzeigen();
    if (geaendert) neuZeichnenWennRuhig();
    if (SY.nochmal) { SY.nochmal = false; syncBald(400); }
  }
}

async function uebernehmen(daten) {
  let geaendert = false;
  const schreiben = [];
  for (const t of TABELLEN) {
    for (const roh of (daten && daten[t]) || []) {
      if (!roh.id) continue;
      const z = normalisieren(roh);
      const lokal = D[t].get(z.id);
      const k = t + '|' + z.id;
      if (lokal && META.offen[k] && (lokal.geaendert || '') > (z.geaendert || '')) continue;
      if (lokal && lokal.geaendert === z.geaendert) { delete META.offen[k]; continue; }
      D[t].set(z.id, z);
      delete META.offen[k];
      schreiben.push({ k, t, z });
      geaendert = true;
    }
  }
  if (schreiben.length) await idb.putViele('zeilen', schreiben);
  return geaendert;
}

function syncAnzeigen() {
  const el = $('#syncpunkt');
  if (!el) return;
  let klasse = '', text = '';
  const offen = anzahlOffen();
  if (modus() !== 'server') { klasse = 'lokal'; text = 'Nur dieses Gerät'; }
  else if (SY.laeuft || SY.status === 'laeuft') { klasse = 'laeuft'; text = 'Abgleich …'; }
  else if (!navigator.onLine || SY.status === 'offline') { klasse = 'offline'; text = offen ? 'Offline · ' + offen + ' offen' : 'Offline'; }
  else if (SY.status === 'fehler') { klasse = 'fehler'; text = 'Abgleich gestört'; }
  else if (offen) { klasse = 'offen'; text = offen + ' offen'; }
  else { klasse = ''; text = 'Abgeglichen'; }
  el.className = 'syncpunkt ' + klasse;
  el.innerHTML = '<i></i>' + esc(text);
  el.title = SY.fehler || (SY.zuletzt ? 'Zuletzt ' + zeitHM(SY.zuletzt) : '');
}

/* ---------- Fotos ---------- */

function bildLaden(datei) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(datei);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild konnte nicht gelesen werden.')); };
    img.src = url;
  });
}
function verkleinern(img, max, qualitaet) {
  const f = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * f);
  c.height = Math.round(img.naturalHeight * f);
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', qualitaet);
}

/** Legt aus einer Bilddatei einen Foto-Eintrag an (offline möglich). */
async function fotoAnlegen(datei, felder, opt = {}) {
  const img = await bildLaden(datei);
  const voll = verkleinern(img, opt.max || 1600, opt.qualitaet || 0.82);
  const thumb = verkleinern(img, 320, 0.6);
  const id = opt.id || neueId();
  if (opt.id && D.fotos.get(id)) { const alt = D.fotos.get(id); Object.assign(felder, { driveId: '' }); META.fotoOffen = META.fotoOffen.filter(x => x !== id); }
  await idb.put('fotos', voll, id);
  const z = Object.assign({ id, thumb, driveId: '', beschreibung: '', aufgenommen: jetztISO() }, felder);
  await speichere('fotos', z, true);
  if (modus() === 'server') { META.fotoOffen.push(id); await metaSichern(); syncBald(); }
  return z;
}

async function fotosHochladen() {
  const liste = [...META.fotoOffen];
  for (const id of liste) {
    const z = D.fotos.get(id);
    const weg = () => { META.fotoOffen = META.fotoOffen.filter(x => x !== id); };
    if (!z || z.geloescht || z.driveId) { weg(); continue; }
    const voll = await idb.get('fotos', id);
    if (!voll) { weg(); continue; }
    const name = z.bezugTyp === 'briefpapier' ? id + '-' + Date.parse(z.aufgenommen || jetztISO()) : id;
    const j = await api('fotoHoch', { id: name, daten: voll.split(',')[1], mime: 'image/jpeg', beschreibung: z.beschreibung || '' });
    z.driveId = j.driveId;
    await idb.put('fotos', voll, id + '|' + j.driveId);
    await idb.del('fotos', id);
    await speichere('fotos', z, true);
    weg();
    await metaSichern();
  }
}

async function fotoVoll(id) {
  const z = D.fotos.get(id);
  if (!z) return null;
  const lokal = await idb.get('fotos', z.driveId ? id + '|' + z.driveId : id) || (z.driveId ? null : await idb.get('fotos', id));
  if (lokal) return lokal;
  if (z.driveId && modus() === 'server' && navigator.onLine) {
    try {
      const j = await api('fotoLaden', { driveId: z.driveId });
      const url = 'data:' + (j.mime || 'image/jpeg') + ';base64,' + j.daten;
      await idb.put('fotos', url, id + '|' + z.driveId);
      return url;
    } catch (e) { console.warn(e); }
  }
  return z.thumb || null;
}

/* ---------- Formulare ---------- */
/** felder: [{n:name, l:label, t:typ, o:optionen, h:hilfe, halb, req, p:placeholder, a:attribute}] */
function formular(felder, w = {}) {
  return '<div class="formular">' + felder.map(f => {
    if (f.t === 'html') return f.html;
    const id = 'f_' + f.n;
    const v = w[f.n] ?? f.d ?? '';
    const kl = 'feld' + (f.halb ? ' halb' : '') + (f.t === 'check' ? ' check' : '');
    const req = f.req ? ' required' : '';
    const ph = f.p ? ` placeholder="${esc(f.p)}"` : '';
    const at = f.a || '';
    let inp;
    switch (f.t) {
      case 'textarea': inp = `<textarea id="${id}" name="${f.n}"${ph}${req} ${at}>${esc(v)}</textarea>`; break;
      case 'select': inp = `<select id="${id}" name="${f.n}"${req} ${at}>${f.o}</select>`; break;
      case 'check': return `<div class="${kl}"><input type="checkbox" id="${id}" name="${f.n}"${v ? ' checked' : ''} ${at}><label for="${id}">${esc(f.l)}</label></div>`;
      case 'zahl': inp = `<input id="${id}" name="${f.n}" inputmode="decimal" data-zahl="1" value="${esc(zahlFeld(v))}"${ph}${req} ${at}>`; break;
      case 'datum': inp = `<input id="${id}" name="${f.n}" type="date" value="${esc(v)}"${req} ${at}>`; break;
      case 'zeit': inp = `<input id="${id}" name="${f.n}" type="time" value="${esc(v)}"${req} ${at}>`; break;
      default: inp = `<input id="${id}" name="${f.n}" type="${f.t || 'text'}" value="${esc(v)}"${ph}${req} ${at}>`;
    }
    return `<div class="${kl}" data-feld="${f.n}"><label for="${id}">${esc(f.l)}</label>${inp}${f.h ? `<span class="hilfe">${esc(f.h)}</span>` : ''}</div>`;
  }).join('') + '</div>';
}
function formWerte(el) {
  const w = {};
  $$('input[name],select[name],textarea[name]', el).forEach(i => {
    if (i.type === 'checkbox') w[i.name] = i.checked;
    else if (i.dataset.zahl) w[i.name] = num(i.value);
    else w[i.name] = i.value.trim();
  });
  return w;
}
function pflichtPruefen(el) {
  const fehlt = $$('[required]', el).find(i => !String(i.value).trim());
  if (fehlt) { fehlt.focus(); toast('Bitte „' + ($('label[for="' + fehlt.id + '"]', el)?.textContent || 'Pflichtfeld') + '“ ausfüllen.'); return false; }
  return true;
}

/* ---------- Blatt (Dialog von unten) ---------- */
function blattOeffnen({ titel, html, knoepfe = [], breit, beimOeffnen, beimSchliessen }) {
  blattSchliessen(true);
  const eb = document.createElement('div');
  eb.className = 'ebene';
  eb.innerHTML = `<div class="blatt" role="dialog" aria-modal="true"${breit ? ' style="max-width:900px"' : ''}>
    <header><h2>${esc(titel)}</h2><button type="button" data-zu aria-label="Schließen">✕</button></header>
    <div class="inhalt">${html}</div>
    ${knoepfe.length ? `<footer>${knoepfe.map((k, i) => `<button type="button" class="knopf ${k.klasse || ''}" data-k="${i}">${esc(k.text)}</button>`).join('')}</footer>` : ''}
  </div>`;
  $('#ebene').appendChild(eb);
  const blatt = $('.blatt', eb);
  UI.blatt = { eb, beimSchliessen };
  eb.addEventListener('click', async ev => {
    if (ev.target === eb || ev.target.closest('[data-zu]')) { blattSchliessen(); return; }
    const b = ev.target.closest('footer [data-k]');
    if (b) {
      const k = knoepfe[+b.dataset.k];
      b.disabled = true;
      try { const r = await k.tun(blatt); if (r !== false) blattSchliessen(); }
      catch (e) { console.error(e); toast(e.message || 'Fehler'); }
      finally { b.disabled = false; }
    }
  });
  if (beimOeffnen) beimOeffnen(blatt);
  const erstes = $('.inhalt input:not([type=hidden]):not([type=checkbox]),.inhalt textarea', blatt);
  if (erstes && window.innerWidth > 700) setTimeout(() => erstes.focus(), 50);
  return blatt;
}
function blattSchliessen(still) {
  if (!UI.blatt) return;
  const b = UI.blatt; UI.blatt = null;
  b.eb.remove();
  if (b.beimSchliessen && !still) b.beimSchliessen();
  if (UI.nachSchliessen) { UI.nachSchliessen = false; zeichnen(); }
}
/** Allgemeines Bearbeiten-Blatt */
function bearbeiten({ titel, felder, werte = {}, speichern, loeschen, vorschau, nachOeffnen, zusatz = '', abbruch, breit }) {
  const knoepfe = [];
  let erledigt = false;
  if (loeschen) knoepfe.push({ text: 'Löschen', klasse: 'gefahr', tun: async () => { if (await bestaetigenSofort('Wirklich löschen? Der Eintrag landet im Papierkorb.')) { erledigt = true; await loeschen(); toast('Gelöscht'); zeichnen(); } else return false; } });
  knoepfe.push({ text: 'Speichern', klasse: 'haupt', tun: async bl => { if (!pflichtPruefen(bl)) return false; const r = await speichern(formWerte(bl), bl); if (r === false) return false; erledigt = true; zeichnen(); } });
  const bl = blattOeffnen({ titel, html: formular(felder, werte) + zusatz, knoepfe, breit, beimSchliessen: () => { if (!erledigt && abbruch) abbruch(); } });
  if (vorschau) { const f = () => vorschau(formWerte(bl), bl); bl.addEventListener('input', f); bl.addEventListener('change', f); f(); }
  if (nachOeffnen) nachOeffnen(bl);
  return bl;
}
function bestaetigenSofort(text) { return Promise.resolve(window.confirm(text)); }

  <main>${inhalt}</main>
  ${fab ? `<button class="fab" data-a="${fab}" aria-label="Neu">+</button>` : ''}

function route() {
  const teile = (location.hash.replace(/^#\/?/, '') || 'start').split('/').map(decodeURIComponent);
  return { seite: teile[0] || 'start', a: teile[1], b: teile[2] };
}
const geheZu = h => { if (location.hash === h) zeichnen(); else location.hash = h; };

/* ---------- Zeichnen ---------- */
function zeichnen() {
  if (!appBereit()) return;
  const r = route();
  const seite = SEITEN[r.seite] || SEITEN.start;
  let html;
  try { html = seite(r); }
  catch (e) { console.error(e); html = rahmen('Fehler', `<div class="karte"><b>Diese Ansicht ließ sich nicht anzeigen.</b><p class="leise">${esc(e.message)}</p><a class="knopf" href="#/start">Zur Startseite</a></div>`); }
  const app = $('#app');
  const scroll = r.seite === UI.letzteSeite && r.a === UI.letztesA ? window.scrollY : 0;
  app.innerHTML = html;
  UI.letzteSeite = r.seite; UI.letztesA = r.a;
  window.scrollTo(0, scroll);
  syncAnzeigen();
  uhrAnzeigen();
  if (UI.nachZeichnen) { const f = UI.nachZeichnen; UI.nachZeichnen = null; f(); }
}
function neuZeichnenWennRuhig() {
  if (!UI.entsperrt || !$('#syncpunkt')) return;
  const fokus = document.activeElement;
  const tippt = fokus && /INPUT|TEXTAREA|SELECT/.test(fokus.tagName);
  if (UI.blatt) { UI.nachSchliessen = true; return; }
  if (tippt) return;
  zeichnen();
}

  const f = AKTION[el.dataset.a];
  if (!f) return;
  ev.preventDefault();
  ev.stopPropagation();

});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-c]');
  if (!el) return;
  const f = AKTION[el.dataset.c];
  if (f) Promise.resolve(f(el, ev)).catch(e => { console.error(e); toast(e.message || 'Fehler'); });
});
AKTION.zurueck = () => { if (history.length > 1) history.back(); else geheZu('#/start'); };

  if (modus() !== 'server') { toast('Die App läuft nur auf diesem Gerät – Server in den Einstellungen verbinden.'); return; }

    <div id="pinFehler" class="fehlertext" style="text-align:center"></div>`);
  $('#app').onkeydown = ev => { if (/^\d$/.test(ev.key)) pinTaste(ev.key); else if (ev.key === 'Backspace') pinTaste('weg'); };

}
AKTION.pin = el => pinTaste(el.dataset.z);
async function pinTaste(z) {
  if (z === 'weg') pinEingabe = pinEingabe.slice(0, -1);
  else if (pinEingabe.length < 4) pinEingabe += z;
  $$('.pinpunkte i').forEach((i, n) => i.classList.toggle('voll', n < pinEingabe.length));
  if (pinEingabe.length < 4) return;
  const pin = pinEingabe; pinEingabe = '';
  if (UI.pinArt === 'pruefen') {
    if (await sha256('bs-pin|' + pin) === ls.get('bs_pin')) {
      UI.entsperrt = true; ls.set('bs_pinfehl', 0); $('#app').onkeydown = null; zeichnen(); if (modus() === 'server') sync();
    } else {
      const fehl = +ls.get('bs_pinfehl', 0) + 1; ls.set('bs_pinfehl', fehl);
      if (fehl >= 5) { ls.set('bs_pin', null); ls.set('bs_pinfehl', 0); if (modus() === 'server') { ls.set('bs_token', null); anmeldungZeigen(); toast('5 falsche PINs – bitte neu anmelden.'); return; } }
      setTimeout(() => { $$('.pinpunkte i').forEach(i => i.classList.remove('voll')); $('#pinFehler').textContent = 'Falsche PIN (' + fehl + ' von 5 Versuchen).'; }, 150);
    }
  } else if (UI.pinArt === 'neu') { pinErst = pin; pinZeigen('wiederholen'); }
  else if (UI.pinArt === 'wiederholen') {
    if (pin === pinErst) { ls.set('bs_pin', await sha256('bs-pin|' + pin)); UI.entsperrt = true; $('#app').onkeydown = null; toast('PIN gespeichert'); zeichnen(); }
    else { pinZeigen('neu'); $('#pinFehler').textContent = 'Die PINs stimmten nicht überein – bitte neu festlegen.'; }
  }
}

/* ===================== Start ===================== */
SEITEN.start = () => {
  const h = heute(), wb = wochenbeginn(h), we = tageDazu(wb, 6), mon = h.slice(0, 7);
  const zeiten = alle('zeiten');
  const stdWoche = zeiten.filter(z => z.datum >= wb && z.datum <= we).reduce((s, z) => s + (+z.stunden || 0), 0);
  const stdMonat = zeiten.filter(z => (z.datum || '').startsWith(mon)).reduce((s, z) => s + (+z.stunden || 0), 0);
  const projekte = alle('projekte');
  let offenSumme = 0;
  projekte.forEach(p => { const o = projektZahlen(p.id).offen; if (o > 0.005) offenSumme += o; });
  const maengel = alle('doku').filter(d => d.art === 'mangel' && d.status !== 'behoben');
  const termine = alle('aufgaben').filter(a => !a.erledigt && a.datum && a.datum <= tageDazu(h, 7))
    .sort((a, b) => (a.datum + (a.zeit || '')).localeCompare(b.datum + (b.zeit || ''))).slice(0, 8);
  const aktiv = projekte.filter(p => AKTIV.has(p.status)).sort((a, b) => (b.geaendert || '').localeCompare(a.geaendert || ''));

    <div class="kennzahl${offenSumme > 0 ? ' warn' : ''}" data-a="geheAuswertung" style="cursor:pointer"><span>Offene Beträge</span><b>${eur(offenSumme)}</b></div>
    <div class="kennzahl${maengel.length ? ' schlecht' : ''}"><span>Offene Mängel</span><b>${maengel.length}</b></div></div>`;
  html += `<div class="abschnitt"><h2>Nächste 7 Tage</h2><a class="klein" href="#/kalender">Kalender</a></div>`;

function gruppenSortiert(positionen) {

    return ia - ib || a.localeCompare(b, 'de');

  return namen.map(n => [n, gruppen[n].sort((a, b) => (a.sort || 0) - (b.sort || 0) || (a.erstellt || '').localeCompare(b.erstellt || ''))]);
}

}

async function schnellAktion(was, pid) {

  if (braucht && !pid) { toast('Bitte zuerst ein Projekt wählen.'); return; }
  if (pid) ls.set('bs_letztesProjekt', pid);
  blattSchliessen(true);
  switch (was) {

      break;

    case 'einkauf': posBearbeiten(null, { pid, bereich: 'ist', typ: 'material' }); break;
    case 'fahrt': posBearbeiten(null, { pid, bereich: 'ist', typ: 'fahrt' }); break;

SEITEN.auswertung = r => {
  const jahre = new Set([String(new Date().getFullYear())]);
  alle('zeiten').forEach(z => z.datum && jahre.add(z.datum.slice(0, 4)));
  alle('dokumente').forEach(z => z.datum && jahre.add(z.datum.slice(0, 4)));
  const jahr = r.a || String(new Date().getFullYear());
  const monate = Array.from({ length: 12 }, (_, i) => ({ m: jahr + '-' + zz(i + 1), std: 0, kosten: 0, abgerechnet: 0, eingang: 0 }));
  const mon = d => monate[+(d || '').slice(5, 7) - 1];
  alle('zeiten').filter(z => (z.datum || '').startsWith(jahr)).forEach(z => { mon(z.datum).std += +z.stunden || 0; });
  alle('positionen').filter(p => p.bereich === 'ist' && (p.datum || '').startsWith(jahr)).forEach(p => { mon(p.datum).kosten += posWerte(p).ek; });
  alle('dokumente').filter(d => d.art === 'abrechnung' && d.status !== 'entwurf' && (d.datum || '').startsWith(jahr)).forEach(d => { mon(d.datum).abgerechnet += +d.netto || 0; });
  alle('zahlungen').filter(z => (z.datum || '').startsWith(jahr)).forEach(z => { mon(z.datum).eingang += +z.betrag || 0; });
  const sum = k => monate.reduce((s, x) => s + x[k], 0);
  const maxStd = Math.max(1, ...monate.map(x => x.std));
  const projekte = alle('projekte').map(p => ({ p, z: projektZahlen(p.id) }))
    .filter(({ p, z }) => z.ist.std || z.soll.vk || z.abgerechnetNetto || (p.beginn || '').startsWith(jahr))
    .sort((a, b) => (b.p.nr || '').localeCompare(a.p.nr || ''));
  const offen = alle('projekte').map(p => ({ p, z: projektZahlen(p.id) })).filter(x => x.z.offen > 0.005);
  let html = `<div class="chips">${[...jahre].sort().reverse().map(j => `<a class="chip${j === jahr ? ' aktiv' : ''}" href="#/auswertung/${j}">${j}</a>`).join('')}</div>
    <div class="raster" style="margin-bottom:12px"><div class="kennzahl"><span>Stunden ${jahr}</span><b>${zahl(sum('std'))}</b></div><div class="kennzahl"><span>Abgerechnet netto</span><b>${eur(sum('abgerechnet'))}</b></div>
    <div class="kennzahl"><span>Zahlungseingang</span><b>${eur(sum('eingang'))}</b></div><div class="kennzahl"><span>Kosten (EK)</span><b>${eur(sum('kosten'))}</b></div></div>
    <div class="karte"><h3>Monate</h3><div class="tabellenrahmen"><table class="tabelle"><tr><th>Monat</th><th>Stunden</th><th></th><th class="z">Kosten</th><th class="z">Abgerechnet</th><th class="z">Eingang</th></tr>
    ${monate.map(x => `<tr><td>${MONATE[+x.m.slice(5) - 1].slice(0, 3)}</td><td class="z">${x.std ? zahl(x.std) : ''}</td><td style="width:22%"><div class="balken"><i style="width:${x.std / maxStd * 100}%"></i></div></td><td class="z">${x.kosten ? eur(x.kosten) : ''}</td><td class="z">${x.abgerechnet ? eur(x.abgerechnet) : ''}</td><td class="z">${x.eingang ? eur(x.eingang) : ''}</td></tr>`).join('')}
    <tr class="summe"><td>Summe</td><td class="z">${zahl(sum('std'))}</td><td></td><td class="z">${eur(sum('kosten'))}</td><td class="z">${eur(sum('abgerechnet'))}</td><td class="z">${eur(sum('eingang'))}</td></tr></table></div></div>
    <div class="karte"><h3>Projekte: Soll/Ist und Gewinn</h3>${projekte.length ? `<div class="tabellenrahmen"><table class="tabelle"><tr><th>Projekt</th><th class="z">Std. Soll</th><th class="z">Std. Ist</th><th class="z">Abw.</th><th class="z">Erlös</th><th class="z">Gewinn</th><th class="z">€/Std.</th></tr>
    ${projekte.map(({ p, z }) => { const a = abweichung(z.soll.std, z.ist.std); return `<tr class="klickbar" data-a="geh" data-h="#/projekt/${p.id}"><td>${esc(p.name)}<div class="leise klein">${esc(p.nr || '')} · ${statusText(p.status)}</div></td><td class="z">${zahl(z.soll.std)}</td><td class="z">${zahl(z.ist.std)}</td><td class="z ${a.klasse}">${a.text}</td><td class="z">${eur(z.erloes)}</td><td class="z ${z.gewinn < 0 ? 'ampel-schlecht' : ''}">${eur(z.gewinn)}</td><td class="z">${z.stundenlohn === null ? '–' : eur(z.stundenlohn)}</td></tr>`; }).join('')}
    </table></div><p class="leise klein" style="margin:8px 0 0">Erlös: abgerechnet, sonst Angebot (Festpreis) bzw. erfasster Aufwand. Gewinn = Erlös − Material − Fremdleistungen − eigene Fahrtkosten. €/Std. = Gewinn ÷ Ist-Stunden.</p>` : leer('Noch keine Projektdaten')}</div>
    <div class="karte"><h3>Offene Beträge</h3>${offen.length ? `<table class="tabelle"><tr><th>Projekt</th><th class="z">Abgerechnet</th><th class="z">Bezahlt</th><th class="z">Offen</th></tr>
    ${offen.map(({ p, z }) => `<tr class="klickbar" data-a="geh" data-h="#/projekt/${p.id}"><td>${esc(p.name)}</td><td class="z">${eur(z.abgerechnetBrutto)}</td><td class="z">${eur(z.bezahlt)}</td><td class="z fett">${eur(z.offen)}</td></tr>`).join('')}

  return rahmen('Auswertung', html, { zurueck: true });
};

AKTION.logoHoch = async () => {
  const [datei] = await fotoWaehlen(false);
  if (!datei) return;
  let url;
  if (datei.type === 'image/svg+xml') {
    url = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(await datei.text())));
  } else {
    const img = await bildLaden(datei);
    for (const max of [600, 450, 320, 240]) {
      const f = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      url = c.toDataURL('image/webp', 0.9);
      if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/png');
      if (url.length < 45000) break;
    }
  }
  if (url.length > 48000) { toast('Das Logo ist zu groß – bitte eine kleinere Datei verwenden.'); return; }
  await setzeE('logo', url); toast('Logo gespeichert'); zeichnen();
};

/* =========================================================================
   Angebote und Abrechnungen
   ========================================================================= */

const DOK_ART = { angebot: 'Angebot', abrechnung: 'Abrechnung' };
const DARSTELLUNG = [['einzeln', 'Einzelpositionen mit Preisen'], ['gruppen', 'Nach Gewerken mit Zwischensummen'], ['summe', 'Positionen ohne Preise, nur Endsumme']];
const dokTitel = d => d.art === 'angebot' ? 'Angebot' : ((d.steuermodus || 'intern') === 'intern' ? 'Kostenaufstellung' : 'Rechnung');

PROJEKT_TAB.dokumente = p => {
  const liste = vonProjekt('dokumente', p.id).sort((a, b) => (b.datum || '').localeCompare(a.datum || '') || (b.erstellt || '').localeCompare(a.erstellt || ''));

    <p class="leise klein" style="margin:0 2px 12px">Abrechnung bei diesem Projekt: <b>${p.art === 'aufwand' ? 'nach Aufwand' : 'Festpreis nach Angebot'}</b>${p.art === 'aufwand' && z.ist.offenStd ? ` · ${zahl(z.ist.offenStd)} Std. noch nicht abgerechnet` : ''}</p>
    ${liste.length ? `<div class="liste">${liste.map(d => `<div class="zeile" data-a="geh" data-h="#/dok/${d.id}"><div class="mitte"><div class="titel">${esc(dokTitel(d))} ${esc(d.nr || '')}</div><div class="unter">${datumDE(d.datum)}${d.titel ? ' · ' + esc(d.titel) : ''}</div></div><div class="wert">${eur(d.status === 'entwurf' ? dokSummen(d).brutto : d.brutto)}<small>${badge(d.status, { entwurf: 'Entwurf', erstellt: 'erstellt', angenommen: 'angenommen', abgelehnt: 'abgelehnt' }[d.status] || d.status)}</small></div></div>`).join('')}</div>`
      : `<div class="liste">${leer('Noch keine Dokumente', 'Ein Angebot entsteht aus der Kalkulation, eine Abrechnung aus Angebot oder erfasstem Aufwand.')}</div>`}`;
};

/* ---------- Anlegen ---------- */
function zeileAusPosition(p) {
  const w = posWerte(p);
  return { id: neueId(), gruppe: p.gruppe || '', typ: p.typ, text: p.bezeichnung || TYPEN[p.typ], menge: +p.menge || 0, einheit: p.einheit || (p.typ === 'lohn' ? 'Std.' : ''), ep: w.ep };
}
function sollZeilen(pid) {
  return gruppenSortiert(vonProjekt('positionen', pid).filter(x => x.bereich !== 'ist')).flatMap(([, l]) => l.map(zeileAusPosition));
}

AKTION.dokNeu = async el => {
  const pid = el.dataset.pid, art = el.dataset.art;
  const p = hol('projekte', pid);
  const entwurf = vonProjekt('dokumente', pid).find(d => d.art === art && d.status === 'entwurf');
  if (entwurf) { toast('Es gibt bereits einen Entwurf – der wird geöffnet.'); geheZu('#/dok/' + entwurf.id); return; }
  const d = {
    projektId: pid, art, nr: '', datum: heute(), titel: p.name, status: 'entwurf',
    darstellung: 'einzeln', steuermodus: E('steuermodus'), steuersatz: En('steuersatz'),
    einleitung: E(art === 'angebot' ? 'angebotEinleitung' : 'abrechnungEinleitung'),
    schluss: E(art === 'angebot' ? 'angebotSchluss' : 'abrechnungSchluss'),
    nachweis: art === 'abrechnung' && p.art === 'aufwand',
    daten: { zeilen: [], nachweis: [], quellen: { zeiten: [], positionen: [] }, abzuege: [] }
  };
  if (art === 'angebot') {
    d.daten.zeilen = sollZeilen(pid);
    if (!d.daten.zeilen.length) { toast('Erst in der Kalkulation Positionen anlegen.'); geheZu('#/projekt/' + pid + '/kalk'); return; }
    d.darstellung = gruppenSortiert(vonProjekt('positionen', pid).filter(x => x.bereich !== 'ist')).filter(([g]) => g).length > 1 ? 'gruppen' : 'einzeln';
  } else if (p.art === 'aufwand') {
    aufwandUebernehmen(d, pid);
    if (!d.daten.zeilen.length) { toast('Es gibt keine erfassten, noch nicht abgerechneten Zeiten oder Kosten.'); return; }
    d.darstellung = 'gruppen';
  } else {
    const ang = angebotFuer(pid);
    if (ang) { d.daten.zeilen = (ang.daten?.zeilen || []).map(z => ({ ...z, id: neueId() })); d.darstellung = ang.darstellung; d.titel = ang.titel; d.einleitung = 'für die ausgeführten Arbeiten laut Angebot ' + (ang.nr || '') + ' vom ' + datumDE(ang.datum) + ' erlaube ich mir, wie folgt abzurechnen:'; }
    else d.daten.zeilen = sollZeilen(pid);
    if (!d.daten.zeilen.length) { toast('Es gibt weder ein Angebot noch eine Kalkulation.'); return; }
  }
  if (art === 'abrechnung') {
    d.daten.abzuege = vonProjekt('zahlungen', pid).filter(z => !z.dokumentId && z.art !== 'zahlung')
      .sort((a, b) => (a.datum || '').localeCompare(b.datum || '')).map(z => ({ id: z.id, datum: z.datum, art: z.art, betrag: z.betrag, an: true }));
  }
  await speichere('dokumente', d);
  geheZu('#/dok/' + d.id);
};

function aufwandUebernehmen(d, pid) {
  const zeiten = vonProjekt('zeiten', pid).filter(z => z.abrechenbar && !z.abgerechnetIn).sort((a, b) => (a.datum + (a.von || '')).localeCompare(b.datum + (b.von || '')));
  const gruppen = {};
  zeiten.forEach(z => { const k = (z.lohnartId || '') + '|' + (+z.satz || 0); (gruppen[k] = gruppen[k] || []).push(z); });
  Object.values(gruppen).forEach(l => {
    const la = hol('lohnarten', l[0].lohnartId);
    const von = l[0].datum, bis = l[l.length - 1].datum;
    d.daten.zeilen.push({ id: neueId(), gruppe: 'Arbeitszeit', typ: 'lohn', text: 'Arbeitszeit ' + (la ? la.name : '') + (von ? ' (' + (von === bis ? datumDE(von) : datumDE(von) + ' – ' + datumDE(bis)) + ')' : ''), menge: Math.round(l.reduce((s, z) => s + (+z.stunden || 0), 0) * 100) / 100, einheit: 'Std.', ep: +l[0].satz || 0 });
  });
  d.daten.nachweis = zeiten.map(z => ({ datum: z.datum, von: z.von, bis: z.bis, pause: z.pause, stunden: z.stunden, text: z.taetigkeit, person: z.person }));
  d.daten.quellen.zeiten = zeiten.map(z => z.id);
  const pos = vonProjekt('positionen', pid).filter(x => x.bereich === 'ist' && !x.abgerechnetIn).sort((a, b) => (a.datum || '').localeCompare(b.datum || ''));
  const namen = { material: 'Material', fremd: 'Fremdleistungen', pauschal: 'Sonstiges' };
  pos.filter(x => x.typ !== 'fahrt').forEach(x => d.daten.zeilen.push(Object.assign(zeileAusPosition(x), { gruppe: namen[x.typ] || 'Sonstiges' })));
  const fahrten = {};
  pos.filter(x => x.typ === 'fahrt').forEach(x => { const k = String(+x.vk || 0); (fahrten[k] = fahrten[k] || []).push(x); });
  Object.values(fahrten).forEach(l => d.daten.zeilen.push({ id: neueId(), gruppe: 'Fahrtkosten', typ: 'fahrt', text: 'Fahrtkosten (' + l.length + (l.length === 1 ? ' Eintrag' : ' Einträge') + ')', menge: Math.round(l.reduce((s, x) => s + (+x.menge || 0), 0) * 10) / 10, einheit: 'km', ep: +l[0].vk || 0 }));
  d.daten.quellen.positionen = pos.map(x => x.id);
}

/* ---------- Summen ---------- */
function dokSummen(d) {
  const zeilen = d.daten?.zeilen || [];
  const netto = rund(zeilen.reduce((s, z) => s + rund((+z.menge || 0) * (+z.ep || 0)), 0));
  const regel = (d.steuermodus || 'intern') === 'regel';
  const steuer = regel ? rund(netto * (+d.steuersatz || 0) / 100) : 0;
  const brutto = rund(netto + steuer);
  const abzug = d.art === 'abrechnung' ? rund((d.daten?.abzuege || []).filter(a => a.an).reduce((s, a) => s + (+a.betrag || 0), 0)) : 0;
  return { netto, steuer, brutto, abzug, zahlbar: rund(brutto - abzug) };
}
