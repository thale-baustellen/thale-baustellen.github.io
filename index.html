  const p = hol('projekte', d.projektId) || {};
  const entwurf = d.status === 'entwurf';
  let leiste = `<div class="dokleiste"><a class="knopf klein" href="#/projekt/${p.id}/dokumente">‹ Projekt</a><button class="knopf klein" data-a="drucken">🖨 Drucken / PDF</button>`;
  if (entwurf) leiste += `<button class="knopf klein haupt" data-a="dokFest" data-id="${d.id}">Festschreiben</button><button class="knopf klein gefahr" data-a="dokWeg" data-id="${d.id}">Verwerfen</button>`;
  else {
    if (d.art === 'angebot') leiste += `<select data-c="dokStatus" data-id="${d.id}" style="padding:6px 10px;border-radius:10px;border:1px solid var(--rand);background:var(--fl)">${optionen([['erstellt', 'Status: offen'], ['angenommen', 'angenommen'], ['abgelehnt', 'abgelehnt']], d.status)}</select>`;
    leiste += `<button class="knopf klein" data-a="dokKopie" data-id="${d.id}">Als Entwurf kopieren</button><button class="knopf klein gefahr" data-a="dokWeg" data-id="${d.id}">Löschen</button>`;
  }
  leiste += '</div>';
  let html = leiste;
  if (entwurf) html += dokEditor(d);
  html += papierHtml(d);
  return rahmen((entwurf ? 'Entwurf: ' : '') + dokTitel(d) + (d.nr ? ' ' + d.nr : ''), html, { zurueck: true });
};

function dokEditor(d) {
  const s = dokSummen(d);
  const zeilen = d.daten.zeilen;
  const gruppenListe = [...new Set([...gewerke(), ...zeilen.map(z => z.gruppe).filter(Boolean)])];
  return `<div class="karte nicht-drucken"><h3>Kopf und Texte</h3><div class="formular">
      <div class="feld halb"><label>Datum</label><input type="date" data-c="dokFeld" data-id="${d.id}" name="datum" value="${esc(d.datum)}"></div>
      <div class="feld halb"><label>Darstellung</label><select data-c="dokFeld" data-id="${d.id}" name="darstellung">${optionen(DARSTELLUNG, d.darstellung)}</select></div>
      <div class="feld"><label>Betreff</label><input data-c="dokFeld" data-id="${d.id}" name="titel" value="${esc(d.titel)}"></div>
      <div class="feld"><label>Einleitung</label><textarea data-c="dokFeld" data-id="${d.id}" name="einleitung" style="min-height:60px">${esc(d.einleitung)}</textarea></div>
      <div class="feld"><label>Schluss</label><textarea data-c="dokFeld" data-id="${d.id}" name="schluss" style="min-height:60px">${esc(d.schluss)}</textarea></div>
      ${d.art === 'abrechnung' && d.daten.nachweis?.length ? `<div class="feld check"><input type="checkbox" id="dokNw" data-c="dokFeld" data-id="${d.id}" name="nachweis"${d.nachweis ? ' checked' : ''}><label for="dokNw">Stundennachweis anhängen (${d.daten.nachweis.length} Einträge)</label></div>` : ''}
    </div></div>
    <div class="karte nicht-drucken"><h3>Positionen <span class="leise klein">${eur(s.netto)}</span></h3>
      <div class="tabellenrahmen"><table class="tabelle zeileneditor"><tr><th style="min-width:180px">Text</th><th>Gruppe</th><th class="z" style="width:80px">Menge</th><th style="width:80px">Einheit</th><th class="z" style="width:96px">Einzelpreis</th><th class="z">Gesamt</th><th></th></tr>
      ${zeilen.map((z, i) => `<tr><td><textarea rows="1" data-c="dokZeile" data-id="${d.id}" data-i="${i}" data-k="text" style="width:100%;padding:7px 6px;border:1px solid var(--rand);border-radius:8px;background:var(--fl);min-height:38px;resize:vertical">${esc(z.text)}</textarea></td>
        <td><select data-c="dokZeile" data-id="${d.id}" data-i="${i}" data-k="gruppe">${optionen([['', '–'], ...gruppenListe], z.gruppe)}</select></td>
        <td><input inputmode="decimal" data-c="dokZeile" data-id="${d.id}" data-i="${i}" data-k="menge" value="${esc(zahlFeld(z.menge))}" style="text-align:right"></td>
        <td><input data-c="dokZeile" data-id="${d.id}" data-i="${i}" data-k="einheit" value="${esc(z.einheit)}"></td>
        <td><input inputmode="decimal" data-c="dokZeile" data-id="${d.id}" data-i="${i}" data-k="ep" value="${esc(zahlFeld(z.ep))}" style="text-align:right"></td>
        <td class="z">${eur(rund((+z.menge || 0) * (+z.ep || 0)))}</td>
        <td style="white-space:nowrap"><button class="knopf klein" data-a="dokZeileHoch" data-id="${d.id}" data-i="${i}" title="nach oben"${i ? '' : ' disabled'}>↑</button> <button class="knopf klein" data-a="dokZeileWeg" data-id="${d.id}" data-i="${i}" title="entfernen">✕</button></td></tr>`).join('')}
      </table></div>
      <div class="knopfreihe" style="margin-top:10px"><button class="knopf klein" data-a="dokZeileNeu" data-id="${d.id}">+ Zeile</button>${d.art === 'angebot' ? `<button class="knopf klein" data-a="dokNeuAusKalk" data-id="${d.id}">Neu aus Kalkulation übernehmen</button>` : ''}</div>
      ${d.art === 'abrechnung' && d.daten.abzuege?.length ? `<h3 style="margin-top:16px">Abzuziehende Zahlungen</h3>${d.daten.abzuege.map((a, i) => `<div class="feld check"><input type="checkbox" id="abz${i}" data-c="dokAbzug" data-id="${d.id}" data-i="${i}"${a.an ? ' checked' : ''}><label for="abz${i}">${esc(ZAHLUNG_ARTEN[a.art] || 'Zahlung')} vom ${datumDE(a.datum)}: ${eur(a.betrag)}</label></div>`).join('')}` : ''}
      <p class="leise klein" style="margin:12px 0 0">Änderungen hier betreffen nur dieses Dokument, nicht die Kalkulation. Beim Festschreiben bekommt es eine Nummer und ändert sich danach nicht mehr${d.art === 'abrechnung' && (d.daten.quellen?.zeiten?.length || d.daten.quellen?.positionen?.length) ? '; die übernommenen Zeiten und Kosten werden als abgerechnet markiert' : ''}.</p>
    </div>`;
}

async function dokAendern(id, fn) {
  const d = hol('dokumente', id);
  if (!d || d.status !== 'entwurf') return;
  d.daten = JSON.parse(JSON.stringify(d.daten || {}));
  fn(d);
  Object.assign(d, dokSummen(d));
  await speichere('dokumente', d);
  zeichnen();
}
AKTION.dokFeld = el => dokAendern(el.dataset.id, d => { d[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
AKTION.dokZeile = el => dokAendern(el.dataset.id, d => { const z = d.daten.zeilen[+el.dataset.i]; const k = el.dataset.k; z[k] = (k === 'menge' || k === 'ep') ? num(el.value) : el.value; });
AKTION.dokZeileNeu = el => dokAendern(el.dataset.id, d => { d.daten.zeilen.push({ id: neueId(), gruppe: '', typ: 'pauschal', text: '', menge: 1, einheit: 'psch.', ep: 0 }); });
AKTION.dokZeileWeg = el => dokAendern(el.dataset.id, d => { d.daten.zeilen.splice(+el.dataset.i, 1); });
AKTION.dokZeileHoch = el => dokAendern(el.dataset.id, d => { const i = +el.dataset.i; if (i > 0) { const z = d.daten.zeilen; [z[i - 1], z[i]] = [z[i], z[i - 1]]; } });
AKTION.dokAbzug = el => dokAendern(el.dataset.id, d => { d.daten.abzuege[+el.dataset.i].an = el.checked; });
AKTION.dokNeuAusKalk = el => { if (confirm('Alle Positionen dieses Entwurfs durch die aktuelle Kalkulation ersetzen?')) dokAendern(el.dataset.id, d => { d.daten.zeilen = sollZeilen(d.projektId); }); };
AKTION.drucken = () => window.print();
AKTION.dokStatus = async el => {
  const d = hol('dokumente', el.dataset.id); d.status = el.value; await speichere('dokumente', d);
  const p = hol('projekte', d.projektId);
  if (d.status === 'angenommen' && p && ['anfrage', 'angebot'].includes(p.status)) { p.status = 'beauftragt'; await speichere('projekte', p); toast('Projekt ist jetzt „Beauftragt“'); }
  zeichnen();
};

AKTION.dokFest = async el => {
  const d = hol('dokumente', el.dataset.id);
  if (!d.daten.zeilen.length) { toast('Das Dokument hat keine Positionen.'); return; }
  if (!confirm(dokTitel(d) + ' festschreiben? Danach bekommt es eine Nummer und lässt sich nicht mehr ändern.')) return;
  const p = hol('projekte', d.projektId) || {};
  const k = hol('kunden', p.kundeId) || {};
  d.daten = JSON.parse(JSON.stringify(d.daten));
  d.nr = naechsteNr(d.art === 'angebot' ? 'nrAngebot' : 'nrAbrechnung', 'dokumente', z => z.art === d.art);
  d.daten.absender = absenderJetzt();
  d.daten.kunde = { name: k.name || '', ansprechpartner: k.ansprechpartner || '', strasse: k.strasse || '', ort: k.ort || '' };
  d.daten.projekt = { nr: p.nr || '', name: p.name || '', strasse: p.strasse || '', ort: p.ort || '' };
  if (!d.nachweis) d.daten.nachweis = [];
  Object.assign(d, dokSummen(d));
  d.status = 'erstellt';
  await speichere('dokumente', d);
  if (d.art === 'abrechnung') {
    for (const id of d.daten.quellen?.zeiten || []) { const z = hol('zeiten', id); if (z && !z.abgerechnetIn) { z.abgerechnetIn = d.id; await speichere('zeiten', z, true); } }
    for (const id of d.daten.quellen?.positionen || []) { const z = hol('positionen', id); if (z && !z.abgerechnetIn) { z.abgerechnetIn = d.id; await speichere('positionen', z, true); } }
    for (const a of (d.daten.abzuege || []).filter(a => a.an)) { const z = hol('zahlungen', a.id); if (z) { z.dokumentId = d.id; await speichere('zahlungen', z, true); } }
    if (p.id && p.status !== 'bezahlt') { p.status = 'abgerechnet'; await speichere('projekte', p, true); }
  } else if (p.id && p.status === 'anfrage') { p.status = 'angebot'; await speichere('projekte', p, true); }
  syncBald();
  toast(dokTitel(d) + ' ' + d.nr + ' erstellt');
  zeichnen();
};
AKTION.dokWeg = async el => {
  const d = hol('dokumente', el.dataset.id);
  const text = d.status === 'entwurf' ? 'Entwurf verwerfen?' : dokTitel(d) + ' ' + d.nr + ' löschen? Übernommene Zeiten, Kosten und Zahlungen werden wieder freigegeben.';
  if (!confirm(text)) return;
  if (d.status !== 'entwurf') {
    for (const z of alle('zeiten').filter(z => z.abgerechnetIn === d.id)) { z.abgerechnetIn = ''; await speichere('zeiten', z, true); }
    for (const z of alle('positionen').filter(z => z.abgerechnetIn === d.id)) { z.abgerechnetIn = ''; await speichere('positionen', z, true); }
    for (const z of alle('zahlungen').filter(z => z.dokumentId === d.id)) { z.dokumentId = ''; await speichere('zahlungen', z, true); }
  }
  await loesche('dokumente', d.id);
  geheZu('#/projekt/' + d.projektId + '/dokumente');
};
AKTION.dokKopie = async el => {
  const a = hol('dokumente', el.dataset.id);
  const entwurf = vonProjekt('dokumente', a.projektId).find(d => d.art === a.art && d.status === 'entwurf');
  if (entwurf) { toast('Es gibt bereits einen Entwurf.'); geheZu('#/dok/' + entwurf.id); return; }
  const d = { projektId: a.projektId, art: a.art, nr: '', datum: heute(), titel: a.titel, status: 'entwurf', darstellung: a.darstellung, steuermodus: E('steuermodus'), steuersatz: En('steuersatz'), einleitung: a.einleitung, schluss: a.schluss, nachweis: false,
    daten: { zeilen: (a.daten?.zeilen || []).map(z => ({ ...z, id: neueId() })), nachweis: [], quellen: { zeiten: [], positionen: [] }, abzuege: [] } };
  await speichere('dokumente', d);
  geheZu('#/dok/' + d.id);
};

function absenderJetzt() {
  const a = {};
  ['firma', 'inhaber', 'strasse', 'ort', 'telefon', 'email', 'web', 'bank', 'iban', 'bic', 'steuernr', 'zahlungsziel'].forEach(k => { a[k] = E(k); });
  return a;
}

/* ---------- Papier ---------- */
function papierHtml(d) {
  const entwurf = d.status === 'entwurf';
  const p = hol('projekte', d.projektId) || {};
  const kAkt = hol('kunden', p.kundeId) || {};
  const a = entwurf || !d.daten.absender ? absenderJetzt() : d.daten.absender;
  const k = entwurf || !d.daten.kunde ? kAkt : d.daten.kunde;
  const pr = entwurf || !d.daten.projekt ? p : d.daten.projekt;
  const s = entwurf ? dokSummen(d) : d;
  const modusD = d.steuermodus || 'intern';
  const zeilen = d.daten.zeilen || [];
  const mitPreis = d.darstellung !== 'summe';
  const firma = a.firma || a.inhaber || 'Briefkopf in den Einstellungen eintragen';
  const absZeile = [a.firma || a.inhaber, a.strasse, a.ort].filter(Boolean).join(' · ');
  const baustelle = [pr.strasse, pr.ort].filter(Boolean).join(', ');
  const zp = z => rund((+z.menge || 0) * (+z.ep || 0));
  const kopfzeile = `<tr><th style="width:44px">Pos.</th><th>Bezeichnung</th><th class="z">Menge</th><th>Einheit</th>${mitPreis ? '<th class="z">Einzelpreis</th><th class="z">Gesamt</th>' : ''}</tr>`;
  const posZ = (nr, z) => `<tr><td>${nr}</td><td style="white-space:pre-wrap">${esc(z.text)}</td><td class="z">${zahl(z.menge, 3)}</td><td>${esc(z.einheit)}</td>${mitPreis ? `<td class="z">${eur(z.ep)}</td><td class="z">${eur(zp(z))}</td>` : ''}</tr>`;
  let tabelle = '';
  if (d.darstellung === 'gruppen') {
    const gruppen = [];
    zeilen.forEach(z => { let g = gruppen.find(x => x.n === (z.gruppe || '')); if (!g) { g = { n: z.gruppe || '', l: [] }; gruppen.push(g); } g.l.push(z); });
    tabelle = gruppen.map((g, gi) => `<tr class="gruppe"><td>${gi + 1}</td><td colspan="${mitPreis ? 5 : 3}">${esc(g.n || 'Weitere Leistungen')}</td></tr>` + g.l.map((z, i) => posZ((gi + 1) + '.' + (i + 1), z)).join('') +
      `<tr class="zwsumme"><td></td><td colspan="4">Summe ${gi + 1} ${esc(g.n || '')}</td><td class="z">${eur(g.l.reduce((x, z) => x + zp(z), 0))}</td></tr>`).join('');
  } else tabelle = zeilen.map((z, i) => posZ(i + 1, z)).join('');
  const ziel = num(a.zahlungsziel) || 14;
  const schluss = (d.schluss || '').replace(/\{ZIEL\}/g, ziel);
  const anrede = k.ansprechpartner ? 'Guten Tag ' + k.ansprechpartner + ',' : 'Sehr geehrte Damen und Herren,';
  let summen = '';
  if (modusD === 'regel') summen += `<tr><td>Summe netto</td><td class="z">${eur(s.netto)}</td></tr><tr><td>zzgl. ${zahl(d.steuersatz)} % Umsatzsteuer</td><td class="z">${eur(s.steuer)}</td></tr><tr class="gesamt"><td>Gesamtbetrag</td><td class="z">${eur(s.brutto)}</td></tr>`;
  else summen += `<tr class="gesamt"><td>Gesamtbetrag</td><td class="z">${eur(s.brutto)}</td></tr>`;
  const abz = d.art === 'abrechnung' ? (d.daten.abzuege || []).filter(x => x.an) : [];
  if (abz.length) summen += abz.map(x => `<tr><td>abzgl. ${esc(ZAHLUNG_ARTEN[x.art] || 'Zahlung')} vom ${datumDE(x.datum)}</td><td class="z">−${eur(x.betrag)}</td></tr>`).join('') + `<tr class="gesamt"><td>Noch zu zahlen</td><td class="z">${eur(s.zahlbar)}</td></tr>`;
  const nachweis = d.art === 'abrechnung' && d.nachweis && (d.daten.nachweis || []).length ? `<div class="nachweis"><h2>Stundennachweis zu ${esc(dokTitel(d))} ${esc(d.nr || '')}</h2><p style="margin:0 0 8px;color:#555">${esc(pr.name || '')}${baustelle ? ' · ' + esc(baustelle) : ''}</p>
    <table class="pos"><tr><th>Datum</th><th>Zeit</th><th>Tätigkeit</th><th class="z">Stunden</th></tr>${d.daten.nachweis.map(n => `<tr><td>${wochentag(n.datum)} ${datumDE(n.datum)}</td><td>${n.von ? esc(n.von) + '–' + esc(n.bis) + (n.pause ? ' (' + n.pause + ' Min. Pause)' : '') : ''}</td><td>${esc(n.text || '')}${n.person ? ' <span style="color:#777">· ' + esc(n.person) + '</span>' : ''}</td><td class="z">${zahl(n.stunden)}</td></tr>`).join('')}
    <tr><td colspan="3"><b>Summe</b></td><td class="z"><b>${zahl(d.daten.nachweis.reduce((x, n) => x + (+n.stunden || 0), 0))}</b></td></tr></table></div>` : '';
  const bp = hol('fotos', 'briefpapier');
  const eigenerKopf = !bp || E('bpKopf') === 'ja';
  const rand = bp ? 'padding:0' : '';
  const bpAuf = bp ? `<table class="bp-rahmen"><thead><tr><td><div style="height:${En('bpOben') || 0}mm"></div></td></tr></thead><tfoot><tr><td><div style="height:${En('bpUnten') || 20}mm"></div></td></tr></tfoot><tbody><tr><td style="padding:0 ${En('bpRechts') || 18}mm 0 ${En('bpLinks') || 20}mm">` : '';
  const bpZu = bp ? '</td></tr></tbody></table>' : '';
  if (bp) UI.nachZeichnen = () => { briefpapierLaden(); druckstilSetzen(true); }; else UI.nachZeichnen = () => druckstilSetzen(false);
  const logo = E('logo');
  return `<div class="papier${bp ? ' mit-bp' : ''}" style="${rand}">${bp ? `<img class="briefpapier" data-bp="1" src="${esc(bp.thumb)}" alt="">` : ''}${bpAuf}
    ${eigenerKopf ? `<div class="briefkopf"><div>${logo ? `<img class="papierlogo" src="${esc(logo)}" alt="">` : ''}${logo && !a.firma ? '' : `<div class="firma">${esc(firma)}</div>`}${a.firma && a.inhaber ? `<div>${esc(a.inhaber)}</div>` : ''}</div>
      <div class="kontakt">${[a.strasse, a.ort, a.telefon ? 'Tel. ' + a.telefon : '', a.email, a.web].filter(Boolean).map(esc).join('<br>')}</div></div>` : ''}
    <div class="absenderzeile">${esc(absZeile)}</div>
    <div class="anschrift">${k.name ? [k.name, k.ansprechpartner, k.strasse, k.ort].filter(Boolean).map(esc).join('<br>') : '<span style="color:#b42318">Kein Kunde im Projekt eingetragen</span>'}</div>
    <div class="kopfdaten"><div><h1>${esc(dokTitel(d))}${entwurf ? ' <span class="entwurfmarke">ENTWURF</span>' : ''}</h1>${d.titel ? `<div style="font-weight:600;margin-top:2px">${esc(d.titel)}</div>` : ''}</div>
      <table><tr><td>Nummer</td><td>${esc(d.nr || '—')}</td></tr><tr><td>Datum</td><td>${datumDE(d.datum)}</td></tr>${pr.nr ? `<tr><td>Projekt</td><td>${esc(pr.nr)}</td></tr>` : ''}${baustelle ? `<tr><td>Baustelle</td><td>${esc(baustelle)}</td></tr>` : ''}</table></div>
    <div class="text">${esc(anrede)}\n\n${esc(d.einleitung || '')}</div>
    <table class="pos">${kopfzeile}${tabelle}</table>
    <table class="summen">${summen}</table>
    ${modusD === 'klein' ? '<p style="margin-top:10px">Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</p>' : ''}
    ${modusD === 'intern' && d.art === 'abrechnung' ? '<p style="margin-top:10px;color:#666;font-size:11px">Kostenaufstellung ohne Ausweis von Umsatzsteuer.</p>' : ''}
    <div class="text">${esc(schluss)}</div>
    <div class="text">Mit freundlichen Grüßen\n\n${esc(a.inhaber || a.firma || '')}</div>
    ${eigenerKopf ? '' : '<!--'}<div class="fuss"><div>${[a.firma || a.inhaber, a.strasse, a.ort].filter(Boolean).map(esc).join('<br>')}</div><div>${[a.telefon ? 'Tel. ' + a.telefon : '', a.email, a.web].filter(Boolean).map(esc).join('<br>')}</div>
      <div>${[a.bank, a.iban ? 'IBAN ' + a.iban : '', a.bic ? 'BIC ' + a.bic : ''].filter(Boolean).map(esc).join('<br>')}</div><div>${a.steuernr ? esc(a.steuernr) : ''}</div></div>${eigenerKopf ? '' : '-->'}
    ${nachweis}${bpZu}
  </div>`;
}

async function briefpapierLaden() {
  const img = $('img[data-bp]');
  if (!img) return;
  const voll = await fotoVoll('briefpapier');
  if (voll && img.isConnected) img.src = voll;
}
function druckstilSetzen(mitBp) {
  let st = $('#druckstil');
  if (!st) { st = document.createElement('style'); st.id = 'druckstil'; document.head.appendChild(st); }
  st.textContent = mitBp ? `@media print{@page{size:A4;margin:0}
    .papier.mit-bp .briefpapier{position:fixed;top:0;left:0;width:210mm;height:297mm}}` : '';
}

/* =========================================================================
   Start
   ========================================================================= */
window.addEventListener('hashchange', () => { blattSchliessen(true); zeichnen(); });
window.addEventListener('online', () => { syncAnzeigen(); syncBald(300); });
window.addEventListener('offline', () => { SY.status = 'offline'; syncAnzeigen(); });
setInterval(() => { if (!document.hidden && modus() === 'server' && UI.entsperrt !== false) sync(); }, 90000);

(async function start() {
  await datenLaden();
  if (modus() === 'lokal') await grunddatenAnlegen();
  if (!ls.get('bs_pin')) UI.entsperrt = true;
  zeichnen();
  if (modus() === 'server' && ls.get('bs_token')) { await sync(); await grunddatenAnlegen(); }
  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* z. B. in der Vorschau ohne sw.js */ });
  }
})();

</script>
</body>
</html>
